{% extends "layouts/base.html" %}

{% block title %}Startseite | Zahlenraten{% endblock %}

{% block content %}

<div class="container pt-2 pb-5">
    <h2 class="mb-5 text-center">Herzlich Willkommen beim Zahlenraten der ITF24c.</h2>

    <div class="row justify-content-center mb-5">
        <div class="col-12 col-md-6 text-center">
            <form method="post" action="{{ url_for('start_game') }}">
                <label for="player-name" class="form-label">Spielername</label>
                <input type="text" class="form-control mb-3" id="player-name" name="player_name" maxlength="80" aria-describedby="player-name-help" required>
                <div id="player-name-help" class="form-text mb-3">max. 80 Zeichen</div>
                <button type="submit" class="btn btn-primary">Spiel starten</button>
            </form>
        </div>
    </div>

    {% include "components/highscore-table.html" %}

</div>

{% endblock %}
