{% extends "layouts/base.html" %}

{% block content %}
<div class="container pt-2 pb-5 text-center mt-5">
    <h2 class="mb-4">Herzlichen Glückwunsch, {{ player_name }}!</h2>
    <p>Du hast die richtige Zahl <strong>{{ target_number }}</strong> in <strong>{{ attempts }}</strong> Versuchen erraten.</p>
    <div class="d-flex justify-content-center gap-3">
        <form method="post" action="{{ url_for('new_try') }}">
            <button type="submit" class="btn btn-primary"  style="width: 200px;">Neue Runde</button>
        </form>

        <form method="get" action="{{ url_for('index') }}">
            <button type="submit" class="btn btn-primary"  style="width: 200px;">Beenden</button>
        </form>
    </div>

</div>
<div class="mt-top container">
    {% include "components/high-score-table.html" %}
</div>
{% endblock %}
