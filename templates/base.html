<!doctype html>
<html lang="de">
    <head>
        {% block head %}
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        {% block styles %}
            {{ bootstrap.load_css() }}
        {% endblock %}

        <title>{% block title %}Zahlenraten{% endblock %}</title>
        {% endblock %}
    </head>
    <body>
        <header class="container pt-3 pb-0 text-center">
            <h1>Zahlenraten</h1>
        </header>
        {% block content %}{% endblock %}

        {% block scripts %}
            {{ bootstrap.load_js() }}
        {% endblock %}
    </body>
</html>
