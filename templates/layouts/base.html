<!doctype html>
<html lang="de">
    <head>
        {% block head %}
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="Zahlenraten-Spiel der ITF24c">
        <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">

        {% block styles %}
            {{ bootstrap.load_css() }}
        {% endblock %}

        <title>{% block title %}Zahlenraten{% endblock %}</title>
        {% endblock %}
    </head>
    <body>
        <header class="container pt-3 pb-0 text-center">
            <h1>Zahlenraten</h1>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>

        {% block scripts %}
            {{ bootstrap.load_js() }}
        {% endblock %}
    </body>
</html>
